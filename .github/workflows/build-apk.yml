name: Build HMorix Client APK (Free)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v5

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔐 Grant gradlew execute permission
        run: chmod +x gradlew

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2g"

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: hmorix-client-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Build Summary
        if: success()
        run: |
          echo "✅ APK built successfully!"
          echo "📱 Download the APK from the Artifacts section of this workflow run."
          ls -lh app/build/outputs/apk/debug/
